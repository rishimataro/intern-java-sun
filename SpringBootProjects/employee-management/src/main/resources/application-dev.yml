spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&serverTimezone=UTC}"
    username: "${DB_USERNAME:root}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.employee_management: DEBUG
