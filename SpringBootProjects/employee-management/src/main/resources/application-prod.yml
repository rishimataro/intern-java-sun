spring:
  sql:
    init:
      mode: "${DB_SCHEMA_INIT_MODE:never}"
      schema-locations: classpath:db/schema-user.sql
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.example.employee_management: INFO
